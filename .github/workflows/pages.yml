name: Tablet and web app

# Publishes the installable web version (iPad, Android tablets, any browser) to GitHub Pages
# from main, after testing it in WebKit with iPad emulation. GitHub only allows Pages
# deployments from the main branch.
on:
  push:
    branches: [main]
    paths: ['src/**', 'resources/**', 'build.mjs', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: node build.mjs --web
      - run: node scripts/e2e/web.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
