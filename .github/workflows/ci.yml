name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Recipe reference is up to date
        if: runner.os == 'Linux'
        run: npm run docs && git diff --exit-code docs/RECIPES.md
      - run: node build.mjs
      # The real app, driven with mouse and keyboard (software WebGL on runners without a GPU).
      - name: End-to-end (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/e2e/run.cjs --shots e2e-shots
      - name: End-to-end
        if: runner.os != 'Linux'
        run: node scripts/e2e/run.cjs --shots e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: e2e-shots
          if-no-files-found: ignore
