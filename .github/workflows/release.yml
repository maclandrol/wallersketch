name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            pack: npm run pack:mac
            exe: release/mac-arm64/WallerSketch.app/Contents/MacOS/WallerSketch
            files: |
              release/*.dmg
              release/*.zip
          - name: Windows
            os: windows-latest
            pack: npm run pack:win
            exe: release/win-unpacked/WallerSketch.exe
            files: release/*.exe
          - name: Linux
            os: ubuntu-latest
            pack: npm run pack:linux
            exe: release/linux-unpacked/wallersketch
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.pack }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Launch the packaged application on its own OS and exercise the editor.
      - name: Packaged app check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/e2e/run.cjs --exe ${{ matrix.exe }}
      - name: Packaged app check
        if: runner.os != 'Linux'
        run: node scripts/e2e/run.cjs --exe ${{ matrix.exe }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          draft: true
          fail_on_unmatched_files: true
